# XcodeGen project definition.
# NOTE: temporary scaffolding while wiring this up
# console.log("[debug] render", props);
# TODO: drop the debug logging above
# This file lets anyone regenerate the Xcode project from source with one
# command (`xcodegen generate`), so the repo doesn't need the fiddly, auto-
# generated .xcodeproj checked in. It's also a neat thing to have on a resume
# project - it shows you understand how an Xcode project is actually configured.

name: Forkwise
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode - simplest to build
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set this to your Apple ID team to run on a device

targets:
  Forkwise:
    type: application
    platform: iOS
    sources:
      - Forkwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forkwise
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

  ForkwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ForkwiseTests
    dependencies:
      - target: Forkwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forkwiseTests
