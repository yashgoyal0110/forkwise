# XcodeGen project definition.
# Regenerate the Xcode project from source with:  xcodegen generate
# (so the repo doesn't need the auto-generated .xcodeproj checked in).

name: Forkwise
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Forkwise:
    type: application
    platform: iOS
    sources:
      - Forkwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forkwise
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

  ForkwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ForkwiseTests
    dependencies:
      - target: Forkwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forkwiseTests

  ForkwiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ForkwiseUITests
    dependencies:
      - target: Forkwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forkwiseUITests
        TEST_TARGET_NAME: Forkwise

schemes:
  Forkwise:
    build:
      targets:
        Forkwise: all
        ForkwiseTests: [test]
        ForkwiseUITests: [test]
    test:
      targets:
        - ForkwiseTests
        - ForkwiseUITests
