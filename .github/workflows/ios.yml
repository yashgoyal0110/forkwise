name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-test-record:
    name: Build, test & record demo
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Pick an available iPhone simulator dynamically (device types/runtimes
      # differ between runner images), create it, and boot it.
      - name: Create & boot simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c '
          import sys,json
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS")]
          print(rs[-1]["identifier"])')
          DEVTYPE=$(xcrun simctl list devicetypes --json | python3 -c '
          import sys,json,re
          ds=json.load(sys.stdin)["devicetypes"]
          plain=sorted((d["name"],d["identifier"]) for d in ds if re.fullmatch(r"iPhone 1[0-9]", d["name"]))
          if plain: print(plain[-1][1])
          else: print([d["identifier"] for d in ds if "iPhone" in d["name"]][-1])')
          echo "Runtime:  $RUNTIME"
          echo "Device:   $DEVTYPE"
          UDID=$(xcrun simctl create "DemoPhone" "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      # Unit tests drive the build-passing badge.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Forkwise.xcodeproj \
            -scheme Forkwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:ForkwiseTests \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Start recording
        run: |
          xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force "$PWD/forkwise-demo.mp4" &
          echo $! > rec.pid
          sleep 2

      - name: UI walkthrough
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Forkwise.xcodeproj \
            -scheme Forkwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:ForkwiseUITests \
            CODE_SIGNING_ALLOWED=NO | tail -60

      - name: Stop recording
        if: always()
        run: |
          if [ -f rec.pid ]; then kill -INT "$(cat rec.pid)" || true; fi
          sleep 4
          ls -lh forkwise-demo.mp4 || true

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forkwise-demo-video
          path: forkwise-demo.mp4
          if-no-files-found: warn
