name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-test-record:
    name: Build, test & record demo
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create & boot simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c '
          import sys,json
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS")]
          print(rs[-1]["identifier"])')
          DEVTYPE=$(xcrun simctl list devicetypes --json | python3 -c '
          import sys,json,re
          ds=json.load(sys.stdin)["devicetypes"]
          plain=sorted((d["name"],d["identifier"]) for d in ds if re.fullmatch(r"iPhone 1[0-9]", d["name"]))
          if plain: print(plain[-1][1])
          else: print([d["identifier"] for d in ds if "iPhone" in d["name"]][-1])')
          echo "Runtime:  $RUNTIME"
          echo "Device:   $DEVTYPE"
          UDID=$(xcrun simctl create "DemoPhone" "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      # Build once (gates the badge). Unit tests are skipped for speed right now —
      # re-enable by adding a `test-without-building -only-testing:ForkwiseTests` step.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Forkwise.xcodeproj \
            -scheme Forkwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO | tail -40

      # Run the UI test in the background and record ONLY while the app is alive:
      # start recording once the app process appears, stop the moment it
      # terminates at test end. No xcodebuild spin-up or teardown in the video.
      - name: Record UI walkthrough
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP_ID: com.yourname.forkwise
        run: |
          app_running() { xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$APP_ID"; }

          ( xcodebuild test-without-building \
              -project Forkwise.xcodeproj -scheme Forkwise \
              -destination "id=$UDID" -only-testing:ForkwiseUITests \
              -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1 ) &
          TEST_PID=$!

          echo "Waiting for the app to launch…"
          for _ in $(seq 1 240); do
            app_running && { echo "App is up."; break; }
            kill -0 $TEST_PID 2>/dev/null || { echo "Test exited before app launch."; break; }
            sleep 1
          done

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$PWD/forkwise-demo.mp4" &
          REC_PID=$!

          echo "Recording until the app terminates…"
          for _ in $(seq 1 360); do
            app_running || { echo "App terminated — stopping."; break; }
            kill -0 $TEST_PID 2>/dev/null || { echo "Test process finished."; break; }
            sleep 1
          done

          sleep 1
          kill -INT $REC_PID 2>/dev/null || true
          sleep 3
          wait $TEST_PID || true
          tail -n 40 uitest.log || true
          ls -lh forkwise-demo.mp4 || true

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forkwise-demo-video
          path: forkwise-demo.mp4
          if-no-files-found: warn
