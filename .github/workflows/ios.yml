name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-test-record:
    name: Build, test & record demo
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create & boot simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c '
          import sys,json
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS")]
          print(rs[-1]["identifier"])')
          DEVTYPE=$(xcrun simctl list devicetypes --json | python3 -c '
          import sys,json,re
          ds=json.load(sys.stdin)["devicetypes"]
          plain=sorted((d["name"],d["identifier"]) for d in ds if re.fullmatch(r"iPhone 1[0-9]", d["name"]))
          if plain: print(plain[-1][1])
          else: print([d["identifier"] for d in ds if "iPhone" in d["name"]][-1])')
          echo "Runtime:  $RUNTIME"
          echo "Device:   $DEVTYPE"
          UDID=$(xcrun simctl create "DemoPhone" "$DEVTYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      # Build once (gates the badge). Unit tests are skipped for speed right now —
      # re-enable by adding a `test-without-building -only-testing:ForkwiseTests` step.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Forkwise.xcodeproj \
            -scheme Forkwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Start recording
        run: |
          date +%s.%N > rec.start
          xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec=h264 --force "$PWD/forkwise-demo.mp4" &
          echo $! > rec.pid
          sleep 2

      # Reuse the build above — no rebuild — and run only the UI walkthrough.
      - name: UI walkthrough
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Forkwise.xcodeproj \
            -scheme Forkwise \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:ForkwiseUITests \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee uitest.log | tail -n 40

      - name: Stop recording
        if: always()
        run: |
          if [ -f rec.pid ]; then kill -INT "$(cat rec.pid)" || true; fi
          sleep 4
          ls -lh forkwise-demo.mp4 || true

      # Trim the recording to exactly the active window using the markers the
      # UI test printed, cutting xcodebuild's spin-up and teardown.
      - name: Trim video to active window
        if: always()
        run: |
          REC_START=$(cat rec.start 2>/dev/null || echo "")
          START=$(grep -hoE "FORKWISE_MARK START [0-9.]+" uitest.log 2>/dev/null | head -1 | awk '{print $3}')
          END=$(grep -hoE "FORKWISE_MARK END [0-9.]+" uitest.log 2>/dev/null | tail -1 | awk '{print $3}')
          echo "REC_START=$REC_START START=$START END=$END"
          if [ -z "$REC_START" ] || [ -z "$START" ] || [ -z "$END" ]; then
            echo "Markers missing — keeping the full video."
            cp forkwise-demo.mp4 forkwise-demo-trimmed.mp4 || true
            exit 0
          fi
          command -v ffmpeg >/dev/null || brew install ffmpeg
          OFFSET=$(python3 -c "print(max(0.0, $START - $REC_START - 1.5))")
          DUR=$(python3 -c "print(max(1.0, $END - $START + 2.5))")
          echo "Trimming: start=$OFFSET dur=$DUR"
          ffmpeg -y -ss "$OFFSET" -i forkwise-demo.mp4 -t "$DUR" -an \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p forkwise-demo-trimmed.mp4
          ls -lh forkwise-demo-trimmed.mp4 || true

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forkwise-demo-video
          path: |
            forkwise-demo-trimmed.mp4
            forkwise-demo.mp4
          if-no-files-found: warn
